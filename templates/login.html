<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LaunchMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='output.css') }}">
    <script>
        (function () {
            var theme = localStorage.getItem('theme') || 'light';
            document.documentElement.classList.toggle('dark', theme === 'dark');
        })();
    </script>
</head>
<body class="bg-gray-50 dark:bg-slate-950 min-h-screen flex items-center justify-center font-inter">
    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-xl p-10 max-w-md w-full">
        <div class="flex justify-end mb-2">
            <button id="theme-toggle" type="button"
                    class="text-sm font-semibold text-slate-500 dark:text-slate-400 hover:text-primary dark:hover:text-primary-light transition-colors">
                <span class="hidden dark:inline">Light mode</span>
                <span class="inline dark:hidden">Dark mode</span>
            </button>
        </div>
        <h2 class="text-3xl font-bold text-slate-800 dark:text-white text-center mb-6">Sign in to LaunchMate</h2>
        {% if error %}
        <div class="mb-4 px-4 py-3 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-sm">
            {{ error }}
        </div>
        {% endif %}
        {% if success %}
        <div class="mb-4 px-4 py-3 rounded-xl bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 text-sm">
            {{ success }}
        </div>
        {% endif %}
        <form method="POST" action="/login" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Email</label>
            <input type="email" name="email" required placeholder="you@example.com" value="{{ email or '' }}"
                   class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary">
            <button type="submit"
                    class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-3 rounded-xl shadow-md transition duration-300">
                Send Magic Link
            </button>
        </form>
        <p class="text-sm text-center text-slate-500 dark:text-slate-400 mt-6">You'll receive a secure link via email to log in.</p>
    </div>
    <script>
        document.getElementById('theme-toggle').addEventListener('click', function () {
            var isDark = document.documentElement.classList.contains('dark');
            document.documentElement.classList.toggle('dark', !isDark);
            localStorage.setItem('theme', !isDark ? 'dark' : 'light');
        });
    </script>
</body>
</html>
