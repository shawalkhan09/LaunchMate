<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — LaunchMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif']
                    },
                    colors: {
                        primary: '#7c3aed',
                        'primary-light': '#a78bfa',
                        'primary-dark': '#6d28d9'
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-white dark:bg-slate-950 min-h-screen flex items-center justify-center font-inter">
    <div class="bg-white/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 backdrop-blur-sm rounded-2xl shadow-xl p-10 max-w-md w-full">
        <h2 class="text-3xl font-bold text-slate-900 dark:text-white text-center mb-6">🔐 Sign in to LaunchMate</h2>
        <form method="POST" action="/login" class="space-y-4">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Email</label>
            <input type="email" name="email" required placeholder="you@example.com"
                   class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary">
            <button type="submit"
                    class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-3 rounded-xl shadow-md transition duration-300">
                Send Magic Link
            </button>
        </form>
        <p class="text-sm text-center text-slate-500 dark:text-slate-400 mt-6">You'll receive a secure link via email to log in.</p>
    </div>
</body>
</html>
